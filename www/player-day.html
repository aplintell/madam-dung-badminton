<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Player Game List</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#0f1115">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="img/icons/icon-192.png">
  <link rel="apple-touch-icon" href="img/icons/icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CL Hóc Môn 246">
</head>
<body class="game-list-page">
  <!-- Player Game List: the day's sets for players opening a shared link. They can mark winners
       and add sets, but there is no way from here to any other page. -->
  <header class="topbar">
    <h1 id="dayTitle"><span class="inline-spinner" aria-hidden="true"></span>Đang tải...</h1>
  </header>

  <main class="container">
    <div id="pageLoading" class="page-loading" role="status" aria-live="polite">
      <div class="loading-spinner" aria-hidden="true"></div>
      <p>Đang tải...</p>
    </div>

    <div id="emptyState" class="empty-state" hidden>
      <p>Chưa có Set nào.</p>
      <p>Bấm nút Thêm Set bên dưới để thêm Set mới.</p>
    </div>

    <div id="gameList" class="game-list" hidden></div>

    <p id="gameHint" class="game-hint" hidden>Set của bạn: bấm vào đội Thắng (bấm lại là hủy), vuốt sang trái hoặc phải để xóa. Bấm 2 lần vào chữ VS để nhân bản Set.</p>
  </main>

  <a id="addGameLink" class="fab-text" href="#">Thêm Set</a>

  <script src="js/version.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/vendor/firebase-app-compat.js"></script>
  <script src="js/vendor/firebase-auth-compat.js"></script>
  <script src="js/vendor/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/db.js"></script>
  <script src="js/services.js"></script>
  <script>
    var dayId = parseInt(new URLSearchParams(window.location.search).get('id'), 10);

    document.getElementById('addGameLink').setAttribute('href', 'game-form.html?dayId=' + dayId + '&from=player');

    var titleEl = document.getElementById('dayTitle');
    var emptyStateEl = document.getElementById('emptyState');
    var gameListEl = document.getElementById('gameList');
    var gameHintEl = document.getElementById('gameHint');

    var playerNameById = {};

    function loadPlayerNames() {
      return Players.findAll().then(function (players) {
        playerNameById = {};
        players.forEach(function (p) {
          playerNameById[p.id] = p.name;
        });
      });
    }

    // Players may only change or delete the sets their own phone added (or cloned).
    function isMine(game) {
      return !!window.DEVICE_ID && game.createdBy === window.DEVICE_ID;
    }

    var toastEl = null;
    var toastTimer = null;

    function showToast(text) {
      if (!toastEl) {
        toastEl = document.createElement('div');
        toastEl.className = 'toast';
        document.body.appendChild(toastEl);
      }
      toastEl.textContent = text;
      toastEl.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toastEl.hidden = true;
      }, 2000);
    }

    function formatTimeLabel(isoString) {
      var d = new Date(isoString);
      var hh = d.getHours() < 10 ? '0' + d.getHours() : String(d.getHours());
      var mm = d.getMinutes() < 10 ? '0' + d.getMinutes() : String(d.getMinutes());
      return hh + ':' + mm;
    }

    function buildTeamElement(teamNumber, name1, name2, winningTeam) {
      var team = document.createElement('div');
      team.className = 'team ' + (teamNumber === 1 ? 'team-left' : 'team-right');
      team.setAttribute('data-team', String(teamNumber));
      if (winningTeam === teamNumber) {
        team.classList.add('winner');
      } else if (winningTeam && winningTeam !== teamNumber) {
        team.classList.add('loser');
      }

      var stampWin = document.createElement('span');
      stampWin.className = 'stamp stamp-win';
      stampWin.textContent = '🏆 Lụm';
      var stampLose = document.createElement('span');
      stampLose.className = 'stamp stamp-lose';
      stampLose.textContent = '😭 Lỏ';

      var players = document.createElement('div');
      players.className = 'players';
      [name1, name2].forEach(function (n) {
        var span = document.createElement('span');
        span.textContent = n;
        players.appendChild(span);
      });

      team.appendChild(stampWin);
      team.appendChild(stampLose);
      team.appendChild(players);
      return team;
    }

    // Same row as the Game List; only the phone's own sets get the swipe-to-delete background.
    function buildGameRowElement(game) {
      var row = document.createElement('div');
      row.className = 'game-row';
      row.setAttribute('data-game-id', String(game.id));

      if (isMine(game)) {
        var bg = document.createElement('div');
        bg.className = 'game-row-bg';
        bg.setAttribute('aria-hidden', 'true');
        bg.textContent = '🗑️ Xóa';
        row.appendChild(bg);
      }

      var content = document.createElement('div');
      content.className = 'game-row-content';

      content.appendChild(buildTeamElement(1, playerNameById[game.team1Player1Id], playerNameById[game.team1Player2Id], game.winningTeam));

      var vsLabel = document.createElement('div');
      vsLabel.className = 'vs-label';
      var vsSpan = document.createElement('span');
      vsSpan.textContent = 'VS';
      vsLabel.appendChild(vsSpan);
      if (game.createdAt) {
        var timeSpan = document.createElement('span');
        timeSpan.className = 'vs-time';
        timeSpan.textContent = formatTimeLabel(game.createdAt);
        vsLabel.appendChild(timeSpan);
      }
      content.appendChild(vsLabel);

      content.appendChild(buildTeamElement(2, playerNameById[game.team2Player1Id], playerNameById[game.team2Player2Id], game.winningTeam));

      row.appendChild(content);
      return row;
    }

    // The list redraws itself from the live listener, so actions here only save; the change
    // then shows up on every phone, this one included.
    function bindGameRow(row, game) {
      var mine = isMine(game);

      row.querySelectorAll('.team').forEach(function (el) {
        el.addEventListener('click', function () {
          if (!mine) {
            showToast('Chỉ người tạo Set mới sửa được');
            return;
          }
          var clickedTeam = parseInt(el.getAttribute('data-team'), 10);
          var newWinningTeam = el.classList.contains('winner') ? null : clickedTeam;
          row.querySelectorAll('.team').forEach(function (t) {
            t.classList.remove('winner', 'loser');
            if (newWinningTeam !== null) {
              var teamNumber = parseInt(t.getAttribute('data-team'), 10);
              t.classList.add(teamNumber === newWinningTeam ? 'winner' : 'loser');
            }
          });
          Games.getOrThrow(game.id)
            .then(function (fresh) {
              return Games.setWinner(fresh, newWinningTeam);
            })
            .catch(function () {
              alert('Không lưu được. Vui lòng thử lại.');
            });
        });
      });

      function duplicateGame() {
        Games.getOrThrow(game.id)
          .then(function (fresh) {
            return Games.duplicate(fresh);
          })
          .then(function () {
            showToast('Đã nhân bản Set');
          })
          .catch(function () {
            alert('Không nhân bản được. Vui lòng thử lại.');
          });
      }

      bindRowGestures(row, row.querySelector('.vs-label'), duplicateGame, mine);
    }

    // Double tap on VS clones the set (any set); swiping deletes it (own sets only).
    function bindRowGestures(row, vsLabel, onVsLabelDoubleTap, canDelete) {
      var content = row.querySelector('.game-row-content');
      var DELETE_THRESHOLD = 90;
      var DOUBLE_TAP_MS = 350;
      var pointerId = null;
      var startX = 0;
      var startY = 0;
      var currentX = 0;
      var dragging = false;
      var moved = false;
      var pointerDownTarget = null;
      var lastVsTapTime = 0;

      row.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) {
          return;
        }
        dragging = true;
        moved = false;
        currentX = 0;
        startX = e.clientX;
        startY = e.clientY;
        pointerId = e.pointerId;
        pointerDownTarget = e.target;
        content.style.transition = 'none';
      });

      row.addEventListener('pointermove', function (e) {
        if (!dragging || e.pointerId !== pointerId || !canDelete) {
          return;
        }
        var dx = e.clientX - startX;
        var dy = e.clientY - startY;
        if (!moved) {
          if (Math.abs(dx) < 10) {
            return;
          }
          if (Math.abs(dy) > Math.abs(dx)) {
            dragging = false;
            return;
          }
          moved = true;
          try {
            row.setPointerCapture(pointerId);
          } catch (err) {
            // ignore if pointer capture isn't supported for this pointer
          }
        }
        currentX = dx;
        content.style.transform = 'translateX(' + currentX + 'px)';
        row.classList.toggle('swiping', Math.abs(currentX) > 10);
      });

      function endDrag() {
        if (!dragging) {
          return;
        }
        dragging = false;
        content.style.transition = '';
        if (moved) {
          row.dataset.justDragged = '1';
        }
        if (canDelete && Math.abs(currentX) > DELETE_THRESHOLD) {
          deleteRow(currentX > 0 ? 1 : -1);
        } else {
          content.style.transform = '';
          row.classList.remove('swiping');
          if (!moved && pointerDownTarget && vsLabel.contains(pointerDownTarget)) {
            var now = Date.now();
            if (now - lastVsTapTime < DOUBLE_TAP_MS) {
              lastVsTapTime = 0;
              onVsLabelDoubleTap();
            } else {
              lastVsTapTime = now;
            }
          }
        }
        currentX = 0;
      }

      row.addEventListener('pointerup', endDrag);
      row.addEventListener('pointercancel', endDrag);

      row.addEventListener('click', function (e) {
        if (row.dataset.justDragged) {
          e.stopPropagation();
          e.preventDefault();
          delete row.dataset.justDragged;
        }
      }, true);

      function deleteRow(direction) {
        var gameId = parseInt(row.getAttribute('data-game-id'), 10);
        content.style.transition = 'transform 0.2s ease';
        content.style.transform = 'translateX(' + (direction > 0 ? '100%' : '-100%') + ')';

        Games.getOrThrow(gameId)
          .then(function (game) {
            return Games.delete(game);
          })
          .catch(function () {
            alert('Không xóa được. Vui lòng thử lại.');
            content.style.transform = '';
            row.classList.remove('swiping');
          });
      }
    }

    // Redrawing under a finger would cancel a swipe or double tap, so updates that arrive while
    // the list is being touched wait until the finger lifts.
    var touching = false;
    var pendingGames = null;

    document.addEventListener('pointerdown', function () {
      touching = true;
    }, true);
    ['pointerup', 'pointercancel'].forEach(function (type) {
      document.addEventListener(type, function () {
        touching = false;
        if (pendingGames) {
          // Let the row's own handlers (double tap, delete) finish first.
          setTimeout(function () {
            if (!touching && pendingGames) {
              var games = pendingGames;
              pendingGames = null;
              renderGames(games);
            }
          }, 400);
        }
      }, true);
    });

    function renderGames(games) {
      if (touching) {
        pendingGames = games;
        return;
      }
      document.getElementById('pageLoading').hidden = true;
      var active = games.filter(function (g) {
        return !g.deletedAt;
      });
      active.sort(function (a, b) {
        return b.id - a.id;
      });
      gameListEl.innerHTML = '';
      emptyStateEl.hidden = active.length !== 0;
      gameListEl.hidden = active.length === 0;
      gameHintEl.hidden = active.length === 0;
      active.forEach(function (game) {
        var row = buildGameRowElement(game);
        gameListEl.appendChild(row);
        bindGameRow(row, game);
      });
    }

    GameDays.getOrThrow(dayId)
      .then(function (day) {
        titleEl.textContent = day.name;
        return loadPlayerNames();
      })
      .then(function () {
        // In the shared (Firebase) version the list updates by itself as sets are added or
        // results marked on any phone.
        if (BadmintonDb.watchByIndex) {
          BadmintonDb.watchByIndex('games', 'gameDayId', dayId, function (games) {
            loadPlayerNames().then(function () {
              renderGames(games);
            });
          });
        } else {
          return Games.findAllForDay(dayId).then(renderGames);
        }
      })
      .catch(function (err) {
        document.getElementById('pageLoading').hidden = true;
        titleEl.textContent = 'Không tìm thấy Ngày Chơi';
        alert(err.message || 'Could not load this day.');
      });
  </script>
</body>
</html>
