<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32" role="img" aria-label="Quả cầu lông">
  <!-- Shuttlecock leaning right: cork at the bottom left, feathers fanning up to the top right. -->
  <g transform="rotate(38 16 16)" stroke-linejoin="round" stroke-linecap="round">
    <!-- feather skirt -->
    <path d="M11.2 20.2 L4.2 4.6 L6.6 2.6 L9.2 4.2 L11.4 1.8 L13.9 3.6 L16 1.2 L18.1 3.6 L20.6 1.8 L22.8 4.2 L25.4 2.6 L27.8 4.6 L20.8 20.2 Z"
          fill="#f6f4ee" stroke="#5b5b5b" stroke-width="0.9"/>
    <!-- feather shading and shafts -->
    <g fill="#e2ded3" stroke="none">
      <path d="M11.2 20.2 L6.6 2.6 L9.2 4.2 Z"/>
      <path d="M13.6 20.2 L11.4 1.8 L13.9 3.6 Z"/>
      <path d="M16 20.2 L16 1.2 L18.1 3.6 Z"/>
      <path d="M18.4 20.2 L20.6 1.8 L22.8 4.2 Z"/>
    </g>
    <g fill="none" stroke="#8a8a8a" stroke-width="0.55">
      <line x1="11.2" y1="20.2" x2="6.6" y2="2.6"/>
      <line x1="13.6" y1="20.2" x2="11.4" y2="1.8"/>
      <line x1="16" y1="20.2" x2="16" y2="1.2"/>
      <line x1="18.4" y1="20.2" x2="20.6" y2="1.8"/>
      <line x1="20.8" y1="20.2" x2="25.4" y2="2.6"/>
      <!-- binding threads across the skirt -->
      <path d="M8.6 14.4 Q16 16.2 23.4 14.4"/>
      <path d="M9.8 17.4 Q16 18.8 22.2 17.4"/>
    </g>
    <!-- dark band -->
    <rect x="10.4" y="19.6" width="11.2" height="2.6" rx="1.1" fill="#3b3b3b"/>
    <!-- cork -->
    <path d="M10.6 22 Q10.4 30.6 16 30.6 Q21.6 30.6 21.4 22 Z" fill="#f2efe6" stroke="#5b5b5b" stroke-width="0.9"/>
    <ellipse cx="13.6" cy="25.6" rx="1.4" ry="2.2" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
