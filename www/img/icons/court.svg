<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 28" role="img" aria-label="Sân cầu lông">
  <!-- Badminton court in perspective: green surface, white lines, net across the middle. -->
  <polygon points="8,2.5 32,2.5 39.5,25.5 0.5,25.5" fill="#2fa84f" stroke="#1d7a35" stroke-width="0.8" stroke-linejoin="round"/>
  <g fill="none" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round">
    <!-- outer boundary -->
    <polygon points="9.5,4.5 30.5,4.5 36.8,23.5 3.2,23.5"/>
    <!-- singles side lines -->
    <line x1="11.6" y1="4.5" x2="6.6" y2="23.5"/>
    <line x1="28.4" y1="4.5" x2="33.4" y2="23.5"/>
    <!-- long service lines (doubles) -->
    <line x1="8.84" y1="6.5" x2="31.16" y2="6.5"/>
    <line x1="3.86" y1="21.5" x2="36.14" y2="21.5"/>
    <!-- short service lines -->
    <line x1="7.35" y1="10.5" x2="32.65" y2="10.5"/>
    <line x1="6.02" y1="15.5" x2="33.98" y2="15.5"/>
    <!-- centre lines -->
    <line x1="20" y1="4.5" x2="20" y2="10.5"/>
    <line x1="20" y1="15.5" x2="20" y2="23.5"/>
  </g>
  <!-- net with posts -->
  <line x1="5.4" y1="13" x2="5.4" y2="8.6" stroke="#333333" stroke-width="1" stroke-linecap="round"/>
  <line x1="34.6" y1="13" x2="34.6" y2="8.6" stroke="#333333" stroke-width="1" stroke-linecap="round"/>
  <rect x="5.4" y="8.8" width="29.2" height="3.6" fill="#ffffff" fill-opacity="0.35" stroke="#e9e9e9" stroke-width="0.6"/>
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.35">
    <line x1="9" y1="8.8" x2="9" y2="12.4"/><line x1="12.6" y1="8.8" x2="12.6" y2="12.4"/>
    <line x1="16.2" y1="8.8" x2="16.2" y2="12.4"/><line x1="19.8" y1="8.8" x2="19.8" y2="12.4"/>
    <line x1="23.4" y1="8.8" x2="23.4" y2="12.4"/><line x1="27" y1="8.8" x2="27" y2="12.4"/>
    <line x1="30.6" y1="8.8" x2="30.6" y2="12.4"/>
    <line x1="5.4" y1="10.6" x2="34.6" y2="10.6"/>
  </g>
  <line x1="5.4" y1="8.8" x2="34.6" y2="8.8" stroke="#ffffff" stroke-width="0.9"/>
</svg>
